<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Proposal Day ♡ For Nishu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0d0614;--petal:#f6d8d3;--rose:#e2577c;--marigold:#f4b64a;--mute:#c6a8ba;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--petal);font-family:'Figtree',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#glow{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,rgba(226,87,124,.28),rgba(226,87,124,0) 55%);animation:beat 2.4s ease-in-out infinite;pointer-events:none}
@keyframes beat{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cap{position:fixed;left:0;right:0;bottom:calc(17% + env(safe-area-inset-bottom,0px));text-align:center;padding:0 28px;font-family:'Gloock',serif;font-size:clamp(1.2rem,4.2vw,1.9rem);line-height:1.35;color:var(--marigold);transition:opacity .6s;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#hint{position:fixed;left:0;right:0;bottom:calc(5% + env(safe-area-inset-bottom,0px));text-align:center;font-size:.88rem;color:var(--mute);pointer-events:none;transition:opacity 1s}
#love{position:fixed;left:0;right:0;bottom:calc(7% + env(safe-area-inset-bottom,0px));text-align:center;font-family:'Gloock',serif;font-size:clamp(1.3rem,4.5vw,2rem);color:var(--petal);opacity:0;transition:opacity .8s;pointer-events:none;user-select:none}
#love.show{opacity:1}
#love.pop span{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25);color:var(--rose)}}
#love span{display:inline-block}
#back,#replay{position:fixed;top:max(16px,env(safe-area-inset-top));z-index:5;color:var(--petal);font:600 .95rem 'Figtree',sans-serif;opacity:.85;background:none;border:0;padding:6px 4px;cursor:pointer;text-decoration:none}
#back{left:18px}
#replay{right:18px;display:none}
#back:hover,#replay:hover{opacity:1}
:focus-visible{outline:2px solid var(--marigold);outline-offset:3px}

#gate{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;background:radial-gradient(circle at 50% 45%,#2b1235,var(--night) 70%);transition:opacity 1.1s}
#gate.gone{opacity:0;pointer-events:none}
#gate h1{font-family:'Gloock',serif;font-weight:400;font-size:clamp(2.4rem,9vw,4.6rem);margin:0;line-height:1.05;color:var(--petal)}
#gate p{margin:0;color:var(--mute);max-width:30ch}
#heart{font-size:4.5rem;color:var(--rose);animation:beat 1.4s ease-in-out infinite;line-height:1}
#open{margin-top:12px;padding:15px 32px;border:0;border-radius:999px;background:var(--marigold);color:#2a1030;font:700 1.05rem 'Figtree',sans-serif;cursor:pointer;transition:transform .2s}
#open:hover{transform:translateY(-2px)}

#locked{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;background:var(--night)}
#locked h1{font-family:'Gloock',serif;font-weight:400;margin:0;font-size:2.2rem}
#locked a{color:var(--marigold);font-weight:700}

@media (prefers-reduced-motion:reduce){#glow,#heart{animation:none}}
</style>
</head>
<body>

<a id="back" href="index.html">← back</a>
<button id="replay" type="button">↻ replay</button>
<div id="glow"></div>
<canvas id="c"></canvas>
<div id="cap"></div>
<div id="hint">Screen par ungli ghumao ✦</div>
<div id="love" aria-live="polite"><span>Touch karo ♡</span></div>

<div id="gate">
  <div id="heart">♥</div>
  <h1>Proposal day</h1>
  <p>Our special day</p>
  <button id="open" type="button">Tap to open ♡</button>
</div>

<div id="locked">
  <h1>Abhi locked hai 🔒</h1>
  <p>Ye 1 November 2026 ko khulega.</p>
  <a href="index.html">← wapas jao</a>
</div>

<audio id="backgroundMusic" loop preload="auto">
  <source src="Jiya%20Dhadak%20Dhadak%20Jaaye%20%E2%80%93%20Full%20Song%20Lyrics%20Rahat%20Fateh%20Ali%20Khan%20Kalyug%20Sayeed%20Quadri%20%5Byouaretube.com%5D.mp3" type="audio/mpeg">
</audio>

<script>
(function(){
/* guard: do not open before the day */
if(new Date()<new Date(2026,10,1)){document.getElementById('locked').style.display='flex';return}

var cv=document.getElementById('c'),cx=cv.getContext('2d'),cap=document.getElementById('cap'),
  hint=document.getElementById('hint'),loveEl=document.getElementById('love'),replayBtn=document.getElementById('replay'),
  backgroundMusic=document.getElementById('backgroundMusic');
var START=new Date(2025,10,1);
var days=Math.max(0,Math.floor((Date.now()-START.getTime())/864e5));

/* the show plays ONCE, then settles on the final "Nishu ♥ Chetan" picture */
var CAPS=[
  {t:'heart',cap:' My heart .'},
  {t:'text',s:'Nishu',cap:'My miss Name.'},
  {t:'text',s:'I love you',cap:'Uss din se lekar aaj tak jo kabhi nhi badla.'},
  {t:'heart',cap:'Us din se ye dil tumhara hai.'},
  {t:'text',s:days.toLocaleString()+' din',cap:'Finally itne din hue proposal ko.'},
  {t:'text',s:'Forever?',cap:'I am with u Forever miss.'},
  {t:'final',cap:'Hamesha tumhara ♡'}
];
var COL=['#ff7a9c','#ffd9a0','#ff4f7b'];
var FONT="'Gloock',Georgia,serif";
var W,H,dpr=Math.min(window.devicePixelRatio||1,2),P=[],S=[],phases=[],cur=-1,px=-999,py=-999,timer=null,done=false,love=0,
    holding=false,holdT=0,HOLD_MS=100;   /* finger held down: one more "love" + same effect every HOLD_MS ms */

function sample(draw,st){
  var o=document.createElement('canvas');o.width=W;o.height=H;var c=o.getContext('2d');
  c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';draw(c);
  var d=c.getImageData(0,0,W,H).data,pts=[];st=st||(W<600?3:4);
  for(var y=0;y<H;y+=st)for(var x=0;x<W;x+=st)if(d[(y*W+x)*4+3]>128)pts.push([x,y]);
  return pts;
}
function textPts(str){
  return sample(function(c){
    c.font='400 100px '+FONT;
    var w=c.measureText(str).width,s=Math.min(100*W*.88/w,H*.34);
    c.font='400 '+s+'px '+FONT;
    c.fillText(str,W/2,H*.42);
  });
}
function drawHeart(c,cx0,cy0,hs){
  c.beginPath();
  for(var t=0;t<=6.2832;t+=.02){
    var x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    var X=cx0+x*hs,Y=cy0-(y+2.5)*hs;t?c.lineTo(X,Y):c.moveTo(X,Y);
  }
  c.fill();
}
function heartPts(){
  var s=Math.min(W*.9/34,H*.56/30);   /* big heart, fills most of the screen */
  return sample(function(c){drawHeart(c,W/2,H*.42,s)});
}
/* final picture: Nishu  ♥  Chetan, with a small beating heart in the middle */
function finalPts(){
  var m=document.createElement('canvas').getContext('2d');
  m.font='400 100px '+FONT;
  var w1=m.measureText('Nishu').width,w2=m.measureText('Chetan').width;
  var fs=Math.min(W*.9/((w1+w2)/100+1.55),H*.14),cy=H*.42,gap=fs*.35,hw=fs*.85,hs=fs*.8/30;
  var names=sample(function(c){
    c.font='400 '+fs+'px '+FONT;c.textBaseline='middle';
    c.textAlign='right';c.fillText('Nishu',W/2-hw/2-gap,cy);
    c.textAlign='left';c.fillText('Chetan',W/2+hw/2+gap,cy);
  },2).map(function(p){return [p[0],p[1],0]});
  var heart=sample(function(c){drawHeart(c,W/2,cy,hs)},2).map(function(p){return [p[0],p[1],1]});
  return {pts:names.concat(heart),hx:W/2,hy:cy};
}
function build(){
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  var n=Math.min(3600,Math.round(W*H/170));
  while(P.length<n)P.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,tx:W/2,ty:H/2,cx:W/2,cy:H*.42,amp:0});
  P.length=n;
  phases=CAPS.map(function(c){
    if(c.t==='final'){var f=finalPts();return {final:true,pts:f.pts,hx:f.hx,hy:f.hy,cap:c.cap}}
    return {heart:c.t==='heart',pts:c.t==='heart'?heartPts():textPts(c.s),cap:c.cap};
  });
  if(cur>=0)assign(cur);
}
function assign(i){
  var ph=phases[i],pts=ph.pts;if(!pts.length)return;
  for(var k=0;k<P.length;k++){
    var q=pts[(Math.random()*pts.length)|0],p=P[k];
    p.tx=q[0]+(Math.random()-.5)*2;p.ty=q[1]+(Math.random()-.5)*2;
    if(ph.final&&q[2]){p.cx=ph.hx;p.cy=ph.hy;p.amp=.22}          /* only the small heart beats */
    else{p.cx=W/2;p.cy=H*.42;p.amp=ph.heart?.035:0}
  }
}
function setCap(t){cap.style.opacity=0;setTimeout(function(){cap.textContent=t;cap.style.opacity=1},500)}
function next(){
  if(cur>=phases.length-1)return;
  cur++;assign(cur);
  for(var k=0;k<P.length;k++){P[k].vx+=(Math.random()-.5)*18;P[k].vy+=(Math.random()-.5)*18}
  setCap(phases[cur].cap);
  if(cur===phases.length-1){            /* last picture reached: stop the loop for good */
    clearInterval(timer);done=true;
    hint.style.opacity=0;replayBtn.style.display='block';
    renderLove();loveEl.classList.add('show');
  }
}
function renderLove(){
  var s=loveEl.firstChild;
  s.textContent=love?('Love – '+love):'Touch karo ♡';
  loveEl.classList.remove('pop');void loveEl.offsetWidth;if(love)loveEl.classList.add('pop');
}

/* touch: after the final picture a tap only makes sparks + bumps the counter, the picture never changes */
function tap(x,y){
  love++;renderLove();
  for(var i=0;i<16;i++){
    var a=Math.random()*6.2832,v=1.5+Math.random()*4.5;
    S.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:1,h:i%3===0});
  }
  for(var k=0;k<P.length;k++){
    var p=P[k],dx=p.x-x,dy=p.y-y,d2=dx*dx+dy*dy;
    if(d2<26000&&d2>1){var d=Math.sqrt(d2),f=(1-d/161)*14;p.vx+=dx/d*f;p.vy+=dy/d*f}
  }
}
function pos(e){px=e.clientX;py=e.clientY}
addEventListener('pointermove',pos);
addEventListener('pointerdown',function(e){
  if(e.target.closest&&e.target.closest('a,button'))return;
  pos(e);
  if(done){tap(e.clientX,e.clientY);holding=true;holdT=performance.now()}
});
['pointerup','pointercancel'].forEach(function(n){addEventListener(n,function(){px=py=-999;holding=false})});
document.addEventListener('pointerleave',function(){px=py=-999;holding=false});
addEventListener('contextmenu',function(e){e.preventDefault()});   /* no long-press menu while holding */

var R=110,R2=R*R;
function frame(ts){
  if(done&&holding&&px>-900&&ts-holdT>=HOLD_MS){holdT=ts;tap(px,py)}   /* finger held: same effect + counter, following the finger */
  cx.globalCompositeOperation='source-over';
  cx.fillStyle='rgba(13,6,20,.28)';cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  var pulse=Math.max(0,Math.sin(ts/260)),ph=phases[cur],fin=ph&&ph.final;
  for(var g=0;g<3;g++){
    cx.fillStyle=COL[g];cx.globalAlpha=fin?.6:.9;
    for(var i=g;i<P.length;i+=3){
      var p=P[i],kk=1+p.amp*pulse,tx=p.cx+(p.tx-p.cx)*kk,ty=p.cy+(p.ty-p.cy)*kk;
      p.vx+=(tx-p.x)*.03;p.vy+=(ty-p.y)*.03;
      var dx=p.x-px,dy=p.y-py,d2=dx*dx+dy*dy;
      if(d2<R2&&d2>1){var d=Math.sqrt(d2),f=(1-d/R)*6;p.vx+=dx/d*f;p.vy+=dy/d*f}
      p.vx*=.86;p.vy*=.86;p.x+=p.vx;p.y+=p.vy;
      cx.fillRect(p.x,p.y,2,2);
    }
  }
  /* tap sparks and little rising hearts */
  for(var j=S.length-1;j>=0;j--){
    var s=S[j];s.x+=s.vx;s.y+=s.vy;s.vy-=.03;s.vx*=.98;s.life-=.018;
    if(s.life<=0){S.splice(j,1);continue}
    cx.globalAlpha=s.life;
    if(s.h){cx.fillStyle='#ff7a9c';cx.font='18px sans-serif';cx.textAlign='center';cx.fillText('♥',s.x,s.y)}
    else{cx.fillStyle='#ffd9a0';cx.fillRect(s.x,s.y,2.4,2.4)}
  }
  cx.globalAlpha=1;
  requestAnimationFrame(frame);
}
function play(){
  done=false;cur=-1;clearInterval(timer);
  replayBtn.style.display='none';loveEl.classList.remove('show');
  next();timer=setInterval(next,5600);
}
function begin(){
  document.getElementById('gate').classList.add('gone');
  build();play();
  requestAnimationFrame(frame);
  setTimeout(function(){if(!done)hint.style.opacity=0},10000);
}
document.getElementById('open').addEventListener('click',function(){
  backgroundMusic.volume=.45;
  try{backgroundMusic.currentTime=30}catch(err){/* Continue playback if seeking is unavailable. */}
  var musicStart=backgroundMusic.play();
  if(musicStart&&musicStart.catch)musicStart.catch(function(){/* Playback can be blocked by browser settings. */});
  (document.fonts&&document.fonts.load)?document.fonts.load('400 100px Gloock').then(begin,begin):begin();
});
replayBtn.addEventListener('click',play);
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(phases.length)build()},200)});
/* dark first frame behind the gate so nothing flashes white */
W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#0d0614';cx.fillRect(0,0,W,H);
})();
</script>
</body>
</html>
